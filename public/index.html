<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>chat-lite</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body class="dark">
<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="btn-new-chat" class="btn btn-primary" title="新对话">+ 新对话</button>
    </div>
    <div id="conv-list" class="conv-list"></div>
    <div class="sidebar-divider"></div>
    <div class="branch-header">🌿 分支</div>
    <div id="branch-panel" class="branch-panel"></div>
    <div class="sidebar-footer">
      <label class="theme-toggle">
        <input type="checkbox" id="theme-checkbox" checked>
        <span class="theme-label">浅色</span>
      </label>
    </div>
  </aside>

  <!-- Main -->
  <main id="main" class="main">
    <!-- Settings bar -->
    <div id="settings-bar" class="settings-bar">
      <button id="btn-sidebar-toggle" class="btn btn-icon" title="切换侧栏">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <select id="model-select" class="model-select"></select>
      <button id="btn-settings" class="btn btn-icon" title="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <span id="status-indicator" class="status-ok"></span>
    </div>

    <!-- Messages -->
    <div id="messages" class="messages"></div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h2>chat-lite</h2>
      <p>连接 DeepSeek API 的轻量聊天界面</p>
    </div>

    <!-- Input area -->
    <div id="input-area" class="input-area">
      <div id="file-preview" class="file-preview" style="display:none"></div>
      <div class="input-row">
        <button id="btn-upload" class="btn btn-icon" title="上传文件">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file-input" accept=".txt,.md,.json,.csv,.js,.py,.html,.css,.xml,.yaml,.yml,.log" multiple style="display:none">
        <div id="chat-input" class="chat-input" contenteditable="true" data-placeholder="输入消息..." role="textbox"></div>
        <button id="btn-send" class="btn btn-send" title="发送">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Settings panel (overlay) -->
  <div id="settings-panel" class="settings-panel" style="display:none">
    <div class="settings-backdrop"></div>
    <div class="settings-content">
      <div class="settings-header">
        <h3>设置</h3>
        <button id="btn-close-settings" class="btn btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="settings-body">
        <label class="setting-row">
          <span>深度思考</span>
          <label class="toggle-switch">
            <input type="checkbox" id="thinking-toggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </label>
        <label class="setting-row setting-row-col">
          <span>系统提示词</span>
          <textarea id="system-prompt" class="setting-textarea" rows="3" placeholder="输入系统提示词..."></textarea>
        </label>
        <label class="setting-row setting-row-col">
          <span>用户身份</span>
          <textarea id="user-identity" class="setting-textarea" rows="2" placeholder="如：我是大二计算机系学生..."></textarea>
        </label>
        <label class="setting-row setting-row-col">
          <span>API 密钥</span>
          <input type="password" id="api-key-input" class="setting-input" placeholder="留空使用 config.json 默认">
        </label>
        <div class="setting-divider"></div>
        <span class="setting-section-title">显示</span>
        <label class="setting-row">
          <span>字体大小</span>
          <select id="font-size-select" class="setting-select">
            <option value="14">小</option>
            <option value="15" selected>中</option>
            <option value="17">大</option>
            <option value="19">超大</option>
          </select>
        </label>
        <label class="setting-row">
          <span>行间距</span>
          <select id="line-spacing-select" class="setting-select">
            <option value="1.4">紧凑</option>
            <option value="1.6" selected>标准</option>
            <option value="1.8">宽松</option>
          </select>
        </label>
      </div>
      <div class="settings-footer">
        <button id="btn-save-settings" class="btn btn-primary">保存设置</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
